[project]
name = "ha-aiper"
version = "1.7.0"
description = "Development tooling for the Aiper Home Assistant custom integration."
readme = "README.md"
requires-python = ">=3.14.2,<3.15"
dependencies = [
    "awsiotsdk>=1.29.0",
]

[dependency-groups]
dev = [
    "homeassistant",
    "mypy",
    "pyright>=1.1.409",
    "pytest",
    "pytest-cov",
    "pytest-homeassistant-custom-component",
    "pyyaml",
    "ruff",
    "types-PyYAML",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["custom_components/aiper"]
# Line coverage, matching how Home Assistant measures the test-coverage rule.
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = true
# Home Assistant's Silver quality scale needs > 95% line coverage in every
# module; .github/scripts/check_coverage.py enforces the per-module floor.
fail_under = 95

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "E701", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.aiper"]
known-third-party = ["aiohttp", "awsiot", "homeassistant"]

[tool.mypy]
python_version = "3.14"
strict = false
ignore_missing_imports = true
explicit_package_bases = true

[tool.pyright]
reportIncompatibleVariableOverride = "none"
